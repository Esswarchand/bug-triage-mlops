apiVersion: v1
kind: Service
metadata:
  name: bug-triage-service
  namespace: bug-triage
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: bug-triage-api