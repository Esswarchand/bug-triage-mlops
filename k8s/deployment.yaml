apiVersion: apps/v1
kind: Deployment
metadata:
  name: bug-triage-api
  namespace: bug-triage
  labels:
    app: bug-triage-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bug-triage-api
  template:
    metadata:
      labels:
        app: bug-triage-api
    spec:
      serviceAccountName: bug-triage-sa
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: 014498631376.dkr.ecr.ap-south-1.amazonaws.com/bug-triage-mlops-api:v1.0.1
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: bug-triage-config
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5